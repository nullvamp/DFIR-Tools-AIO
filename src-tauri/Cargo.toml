[package]
name = "dfir-operations-console"
version = "0.1.0"
description = "Local operations console for approved DFIR tools"
authors = ["DFIR Operations"]
edition = "2021"

[lib]
name = "dfir_operations_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
