# Trusted registry. The backend loads and validates these definitions.
tools:
  - id: kape
    name: KAPE
    category: Windows Forensics
    subcategory: Collection
    type: application
    executable: "${DFIR_TOOLS}\\Collection\\KAPE\\kape.exe"
    description: Rapid Windows forensic collection and processing
    requires_admin: true
    enabled: true
    arguments: []
